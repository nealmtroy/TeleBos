# TeleBos — Multi-Account Telegram Manager
# docker-compose.yml for full-stack deployment
#
# Semua env vars diambil dari root .env file (satu sumber, konsisten).
# Lihat .env.example untuk referensi semua variable yang dibutuhkan.

services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.env
    # Raise the ceiling so the three app pools (backend, async worker, bot)
    # cannot collectively exhaust it. Pool sizes are tuned in
    # backend/app/database.py to fit within this budget.
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: telebos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change-redis-secret-in-production}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-redis-secret-in-production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    init: true
    build: ./backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-redis-secret-in-production}@redis:6379/0
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      # Set CAMOUFOX_SOLVER_ENABLED=true in .env to prefer the local solver.
      # The URL default already matches the compose service name.
      CAMOUFOX_SOLVER_ENABLED: ${CAMOUFOX_SOLVER_ENABLED:-false}
      CAMOUFOX_SOLVER_URL: ${CAMOUFOX_SOLVER_URL:-http://camoufox-solver:8000}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_uploads:/app/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Async Worker (Broadcast & Invite) ──────────────────────────────────
  async-worker:
    init: true
    build: ./backend
    restart: unless-stopped
    command: python -m app.workers.async_worker
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-redis-secret-in-production}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Telegram Bot ──────────────────────────────────────────────────────────
  telegram-bot:
    init: true
    build: ./backend
    restart: unless-stopped
    command: python -m app.bot.main
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-redis-secret-in-production}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Next.js Frontend ───────────────────────────────────────────────────────
  frontend:
    init: true
    build:
      context: ./frontend
      args:
        - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-dikn5vvaNkzkAn/vu+hTSmAJS/1n/RYxtlcWrt7kINM=}
        - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
        - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL:-https://tele.t-me.site}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/v1}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://tele.t-me.site}
        - NEXT_PUBLIC_BETTER_AUTH_URL=${NEXT_PUBLIC_BETTER_AUTH_URL:-https://tele.t-me.site}
    restart: unless-stopped
    env_file: ./.env
    environment:
      API_PROXY_TARGET: http://backend:8000
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/telebos
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://tele.t-me.site}
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://tele.t-me.site}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-https://tele.t-me.site}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-dikn5vvaNkzkAn/vu+hTSmAJS/1n/RYxtlcWrt7kINM=}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # ── Camoufox Turnstile solver ─────────────────────────────────────────────
  # Local replacement for 2captcha: solves Telegram's Cloudflare Turnstile in a
  # real browser, no per-solve fee. Only reached when CAMOUFOX_SOLVER_ENABLED is
  # true; 2captcha stays wired as the fallback.
  #
  # No published port — it is only ever called by the backend over the compose
  # network, and it has no auth of its own.
  camoufox-solver:
    build: ./backend/camoufox_solver
    restart: unless-stopped
    # The browser's content sandbox needs user namespaces, which the container
    # runtime denies. The Dockerfile disables it inside Firefox instead, so no
    # blanket --security-opt is required here.
    environment:
      SOLVER_POLL_SECONDS: ${SOLVER_POLL_SECONDS:-40}
      SOLVER_NAV_TIMEOUT_MS: ${SOLVER_NAV_TIMEOUT_MS:-45000}
    depends_on:
      - backend
    # One worker only: the browser is launched at startup and shared, and
    # Turnstile dislikes a burst of parallel challenges from one address.
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  backend_uploads:
