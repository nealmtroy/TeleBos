[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Start with an E/F baseline. Existing application modules use deferred imports,
# SQLAlchemy forward references, and historical imports that need a dedicated
# cleanup; keep these legacy categories non-blocking while enforcing the suite.
select = ["E", "F"]
ignore = ["E402", "E501", "E712", "E741", "F401", "F541", "F811", "F821", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = []
